  <script>
    function openLightbox(src) {
      if (!src) return;
      var overlay = document.createElement('div');
      overlay.className = 'lightbox-overlay';
      var img = document.createElement('img');
      img.src = src;
      overlay.appendChild(img);
      function close() { overlay.remove(); document.removeEventListener('keydown', onKey); }
      function onKey(e) { if (e.key === 'Escape') close(); }
      overlay.addEventListener('click', close);
      document.addEventListener('keydown', onKey);
      document.body.appendChild(overlay);
    }

    (function () {
      function fitFooterName() {
        var el = document.querySelector('.footer-name');
        if (!el) return;
        var parent = el.parentElement;
        var lo = 8, hi = 600;
        while (hi - lo > 0.5) {
          var mid = (lo + hi) / 2;
          el.style.fontSize = mid + 'px';
          if (el.scrollWidth <= parent.clientWidth) lo = mid;
          else hi = mid;
        }
        el.style.fontSize = lo + 'px';
      }
      document.addEventListener('DOMContentLoaded', fitFooterName);
      window.addEventListener('resize', fitFooterName);
    })();
  </script>
